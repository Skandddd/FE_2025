<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <ul id="contact-list" class="contact-list"></ul>
  <ul id="contact-edit" class="contact-edit hidden">
    <li><input type="text" id="edit-name" placeholder="Name"></li>
    <li><input type="text" id="edit-username" placeholder="Username"></li>
    <li><input type="text" id="edit-phone" placeholder="Phone"></li>
    <li><input type="text" id="edit-website" placeholder="Website"></li>
    <li><input type="text" id="edit-email" placeholder="Email"></li>
    <li><button id="save-btn">Save</button></li>
  </ul>
</div>
<script src="index.js"></script>
</body>
</html>
